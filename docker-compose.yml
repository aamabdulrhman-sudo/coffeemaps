services:
  postgres:
    image: postgres:16-alpine
    container_name: coffeemap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffeemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffeemap_secret}
      POSTGRES_DB: ${POSTGRES_DB:-coffeemap}
    ports:
      - '5432:5432'
    volumes:
      - coffeemap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coffeemap} -d ${POSTGRES_DB:-coffeemap}']
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: coffeemap-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coffeemap}:${POSTGRES_PASSWORD:-coffeemap_secret}@postgres:5432/${POSTGRES_DB:-coffeemap}?schema=public
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: coffeemap-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - '8111:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coffeemap}:${POSTGRES_PASSWORD:-coffeemap_secret}@postgres:5432/${POSTGRES_DB:-coffeemap}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8111}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8111}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - coffeemap_uploads:/app/public/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  coffeemap_pgdata:
  coffeemap_uploads:
